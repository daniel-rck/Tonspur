name = "tonspur"
main = "worker/index.ts"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
# SPA fallback: an unmatched path serves index.html instead of 404ing, so a
# direct load or refresh of a client-side route works. Every other app in the
# fleet sets this; Tonspur was the only one missing it.
not_found_handling = "single-page-application"

# For the future YouTube search proxy, store the API key as a secret:
#   wrangler secret put YT_API_KEY
